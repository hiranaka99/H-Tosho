services:
  h-tosho:
    # Prebuilt image for linux/amd64 from the GitHub Container Registry. To build
    # from a local checkout instead (for example on ARM), uncomment `build: .`
    # and start with `docker compose up -d --build`.
    image: ghcr.io/hiranaka99/h-tosho:latest
    # build: .
    container_name: h-tosho
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - HTOSHO_DATA_DIR=/data
    volumes:
      - h-tosho-data:/data
    restart: unless-stopped

volumes:
  h-tosho-data:
